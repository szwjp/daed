name: Check Upstream

# 借鉴 QiuSimons/luci-app-daed 的 autoupdate.yml 骨架（定时查三个上游、发现更新就处理），
# 但有四处刻意不同，见各步骤上方的 ① ② ③ ④ 注释：
#   ① bump dae-core 前校验 wing 依赖的 dae API 仍在（上游不做这个检查）
#   ② dae-core pin 存普通文件 dae-core.pin，不动 .github/workflows/
#      （GITHUB_TOKEN 没有 workflows 权限，改 workflow 文件的 push 会被服务端拒绝）
#   ③ submodule 指针用 git 命令改，不用 sed 改文本
#   ④ bump wing 后校验 wing 依赖的 dae 导出符号在当前 pin 中仍存在
#
# 本文件只负责"把指针推到该去的位置"，最终把关交给 build-custom.yml 里
# 那道 `Assert dae-core pin matches dae main` 断言——它由本文件在 push 后显式触发
# （GITHUB_TOKEN 的 push 事件不会创建新的 workflow run）。
#
# 操作手册：README.md §5（手动 bump）/ §6（人工解 merge 冲突）/ §7（验证命令）
#
# 注意：公开仓库的 scheduled workflow 在 60 天无活动后会被 GitHub 自动禁用，
# fork 里的 schedule 也需要手动启用；发现定时不再触发时去 Actions 页面重新启用。

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 00:00 = 北京时间 08:00

permissions:
  contents: write
  # 推送后显式触发 build-custom.yml 需要 actions: write。
  # 原因：GITHUB_TOKEN 触发的 push 事件不会创建新的 workflow run
  # （workflow_dispatch / repository_dispatch 例外），所以不能指望 push 自动带起下游。
  actions: write
  # 失败时把 run 记到 issue 里（见文件末尾 notify job）
  issues: write

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      need_dae: ${{ steps.probe.outputs.need_dae }}
      need_wing: ${{ steps.probe.outputs.need_wing }}
      need_daed: ${{ steps.probe.outputs.need_daed }}
      dae_new: ${{ steps.probe.outputs.dae_new }}
      wing_new: ${{ steps.probe.outputs.wing_new }}
      dae_commits: ${{ steps.probe.outputs.dae_commits }}
      wing_commits: ${{ steps.probe.outputs.wing_commits }}
      custom_check: ${{ steps.probe.outputs.custom_check }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Probe upstream
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/daeuniverse/dae/commits/main      --jq '.sha' > /tmp/dae.sha
          gh api repos/daeuniverse/dae-wing/commits/main --jq '.sha' > /tmp/wing.sha
          gh api repos/daeuniverse/daed/commits/main     --jq '.sha' > /tmp/daed.sha

          DAE_NEW="$(cat /tmp/dae.sha)"
          WING_NEW="$(cat /tmp/wing.sha)"
          DAED_NEW="$(cat /tmp/daed.sha)"

          # 本地 pin 值。dae-core pin 放在仓库根目录的普通文件 dae-core.pin（一行 40 位 sha）。
          # 放普通文件而不是 workflow 里，是为了让自动 bump 不触碰 .github/workflows/——
          # GITHUB_TOKEN 没有 workflows 权限，改 workflow 文件的 push 会被服务端拒绝。
          DAE_OLD="$(sed -nE 's/^([0-9a-f]{40})[[:space:]]*$/\1/p' dae-core.pin | head -1)"
          WING_OLD="$(git -C wing rev-parse HEAD)"
          DAED_OLD="$(git rev-parse HEAD)"
          [ -n "$DAE_OLD" ] || { echo "::error::未能从 dae-core.pin 解析出 40 位 sha"; exit 1; }

          need_dae=false;  [ "$DAE_OLD"  = "$DAE_NEW"  ] || need_dae=true
          need_wing=false; [ "$WING_OLD" = "$WING_NEW" ] || need_wing=true

          # daed 层不能用 SHA 相等判断：本 fork 有自己的提交，HEAD 永远不等于上游 tip，
          # 那样 need_daed 恒为 true（每天白跑一次 merge，且真有更新时也判断不出差别）。
          # 正确语义是「上游还有没有本 fork 缺的提交」，用 compare API 的 ahead_by。
          daed_behind="$(gh api "repos/daeuniverse/daed/compare/$DAED_OLD...$DAED_NEW" --jq '.ahead_by' 2>/dev/null || true)"
          if [ -z "$daed_behind" ]; then
            echo "::warning::compare API 取不到 daed 落后数，保守按「上游有更新」处理"
            need_daed=true; daed_behind="?"
          elif [ "$daed_behind" -gt 0 ] 2>/dev/null; then
            need_daed=true
          else
            need_daed=false; daed_behind=0
          fi

          # 落后多少个 commit（用于提交信息 / step summary）。
          # dae-core 用 submodule 自己的克隆算，不要把上游对象 fetch 进本仓库。
          dae_commits=0
          if [ "$need_dae" = true ]; then
            git -C wing/dae-core fetch -q origin main
            dae_commits="$(git -C wing/dae-core rev-list --count "$DAE_OLD..$DAE_NEW" 2>/dev/null || echo '?')"
          fi
          wing_commits=0
          if [ "$need_wing" = true ]; then
            git -C wing fetch -q origin main
            wing_commits="$(git -C wing rev-list --count "$WING_OLD..$WING_NEW" 2>/dev/null || echo '?')"
          fi

          echo "dae   : ${DAE_OLD:0:8} -> ${DAE_NEW:0:8}  (behind $dae_commits)"
          echo "wing  : ${WING_OLD:0:8} -> ${WING_NEW:0:8}  (behind $wing_commits)"
          echo "daed  : ${DAED_OLD:0:8} -> ${DAED_NEW:0:8}  (behind $daed_behind)"

          # 自有改动指纹：push 前与 merge 后共用同一份脚本，避免两处清单漂移
          custom_check=ok
          if ! bash hack/check-fork-customizations.sh; then custom_check=missing; fi

          {
            echo "need_dae=$need_dae"
            echo "need_wing=$need_wing"
            echo "need_daed=$need_daed"
            echo "dae_new=$DAE_NEW"
            echo "wing_new=$WING_NEW"
            echo "dae_commits=$dae_commits"
            echo "wing_commits=$wing_commits"
            echo "custom_check=$custom_check"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 上游检查"
            echo ""
            echo "| 层 | 本地 | 上游 | 需要更新 | 落后 |"
            echo "|---|---|---|---|---|"
            echo "| dae-core | ${DAE_OLD:0:8} | ${DAE_NEW:0:8} | $need_dae | $dae_commits |"
            echo "| dae-wing | ${WING_OLD:0:8} | ${WING_NEW:0:8} | $need_wing | $wing_commits |"
            echo "| daed | ${DAED_OLD:0:8} | ${DAED_NEW:0:8} | $need_daed | $daed_behind |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$need_dae$need_wing$need_daed" = "falsefalsefalse" ]; then
            echo "全部已同步，无需处理。"
          fi

  bump:
    needs: check
    if: needs.check.outputs.need_dae == 'true' || needs.check.outputs.need_wing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 这个 job 要 push：不能用 persist-credentials: false，否则 checkout 结束前
      # 凭据就被删掉，后面的 git push 必然以「could not read Username」失败。
      # token 可选覆盖：配了 secrets.SYNC_TOKEN（PAT/App token，Contents+Workflows
      # 读写）就能连上游 workflow 文件的改动一起推，并让 push 事件自动触发下游构建。
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      # 与上游做法的差异 ①：bump 前验证 wing 依赖的 dae API 还在。
      # QiuSimons 直接把 CORE 设成 main tip，不做这个检查，API 消失后要到
      # 编译失败才发现。这里提前挡住，并把原因写清楚。
      - name: Safety check - wing 依赖的 dae API 仍然存在
        if: needs.check.outputs.need_dae == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NEW="${{ needs.check.outputs.dae_new }}"
          [[ "$NEW" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::dae_new 不是合法 sha: '$NEW'"; exit 1; }

          # 先区分「读不到」和「读到了但符号不在」：404/网络/限流不能当成 API 变更，
          # 否则会误报「上游重构了 API」并要求人工介入。
          if ! gh api "repos/daeuniverse/dae/contents/config/marshal.go?ref=$NEW" --jq '.content' > /tmp/marshal.b64; then
            echo "::error title=读取上游失败::marshal.go@$NEW 读取失败（404/网络/限流），无法判断，本次不 bump，请重跑"
            exit 1
          fi
          if base64 -d /tmp/marshal.b64 | grep -qE 'func \(m \*Marshaller\) Bytes\(\)'; then
            echo "::notice::Marshaller.Bytes 在 $NEW 中存在，可以安全 bump"
            exit 0
          fi
          {
            echo "## ⛔ 未 bump：dae API 已变"
            echo ""
            echo "\`Marshaller.Bytes()\`（\`config/marshal.go\`）在 dae \`$NEW\` 中不存在或已重构。"
            echo "wing main 依赖该方法，自动 bump 会导致构建失败。"
            echo ""
            echo "需要人工介入，按 README §5 手动处理。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=dae API 变更，放弃自动 bump::Marshaller.Bytes 已消失，需人工确认"
          exit 1

      # 与上游做法的差异 ②：pin 存仓库根目录的普通文件 dae-core.pin，不写进本 workflow。
      # 否则自动 bump 会改动 .github/workflows/ 下的文件，而 GITHUB_TOKEN 没有
      # workflows 权限，服务端会直接拒绝这次 push。
      - name: Bump dae-core pin
        if: needs.check.outputs.need_dae == 'true'
        run: |
          set -euo pipefail
          NEW="${{ needs.check.outputs.dae_new }}"
          # 先校验 sha 合法性：坏值（空串/undefined）也会让"回读"假通过
          [[ "$NEW" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::dae_new 不是合法 sha: '$NEW'"; exit 1; }
          printf '%s\n' "$NEW" > dae-core.pin
          # 回读校验，不一致就停——绝不推一个写坏的 pin
          [ "$(cat dae-core.pin)" = "$NEW" ] \
            || { echo "::error::dae-core.pin 回读不一致"; exit 1; }
          echo "dae-core.pin -> $NEW"

      # 与上游做法的差异 ③：submodule 指针用 git 命令改，不用 sed。
      # 指针是 git 对象不是文本，改错会得到一个损坏的 submodule。
      - name: Bump dae-wing submodule
        if: needs.check.outputs.need_wing == 'true'
        run: |
          set -euo pipefail
          NEW="${{ needs.check.outputs.wing_new }}"
          git -C wing fetch -q origin "$NEW"
          git -C wing checkout -q "$NEW"
          git -C wing submodule update --init --recursive
          [ "$(git -C wing rev-parse HEAD)" = "$NEW" ] \
            || { echo "::error::wing 指针回读不一致"; exit 1; }
          echo "wing -> $NEW"

      # 与上游做法的差异 ④：bump wing 后，验证 wing 依赖的 dae 导出符号在当前 pin 里还在。
      # 上一道检查只覆盖「bump dae-core」，但 bump wing 有同样的风险——新版 wing
      # 可能要求 dae 侧更新过的 API。wing 通过 go.mod 的 replace 编译期绑定 ./dae-core，
      # 缺符号就是 make deps 阶段编译失败，那时才知道就晚了。
      #
      # 这几个是 wing 直接 import 并调用、缺了必编译失败的符号。Marshaller.Bytes 尤其关键：
      # 它正是 dae #1117 为 wing 补的（wing 自己锁的 dbae2e82 里没有这个方法）。
      # 更彻底的替代是在 runner 上按「新 wing + 新 pin」跑一次 go build（成本高，暂不做）。
      - name: Safety check - wing 依赖的 dae API 在当前 pin 中存在
        if: needs.check.outputs.need_wing == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN="$(sed -nE 's/^([0-9a-f]{40})[[:space:]]*$/\1/p' dae-core.pin | head -1)"
          [ -n "$PIN" ] || { echo "::error::解析不出 dae-core.pin"; exit 1; }
          echo "验证 pin=$PIN 是否仍提供 wing 依赖的符号"

          MISSING=""; UNREADABLE=""
          # $1=路径 $2=正则 $3=标签。"读不到"与"符号缺失"分开记：404/限流不能报成 API 变更。
          check_symbol() {
            if ! gh api "repos/daeuniverse/dae/contents/$1?ref=$PIN" --jq '.content' > /tmp/sym.b64; then
              UNREADABLE="${UNREADABLE:+$UNREADABLE }$3($1)"; return 0
            fi
            base64 -d /tmp/sym.b64 | grep -qE "$2" || MISSING="${MISSING:+$MISSING }$3($1)"
          }
          check_symbol config/marshal.go     'func \(m \*Marshaller\) Bytes\(\)' 'Marshaller.Bytes'
          check_symbol control/tcp.go        'type RouteDialParam struct'          'control.RouteDialParam'
          check_symbol common/consts/ebpf.go 'OutboundControlPlaneRouting'         'consts.OutboundControlPlaneRouting'
          check_symbol config/desc.go        'SectionDescription'                  'config.SectionDescription'

          if [ -n "$UNREADABLE" ]; then
            echo "::error title=读取上游失败::这些文件读不到（404/网络/限流），无法判断，本次不 bump wing:$UNREADABLE"
            exit 1
          fi
          if [ -n "$MISSING" ]; then
            {
              echo "## ⛔ 未 bump wing：dae-core pin 缺少 wing 依赖的 API"
              echo ""
              echo "缺失符号: \`$MISSING\`"
              echo ""
              echo "pin \`$PIN\` 无法满足新版 dae-wing 的编译需求，直接 bump 会导致 make deps 失败。"
              echo "需要先升级 dae-core pin，按 README §5 手动处理。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=wing 依赖缺失，放弃自动 bump::$MISSING"
            exit 1
          fi
          echo "::notice::wing 依赖的 4 个 dae 符号在 pin 中均存在，可安全 bump"

      - name: Verify custom changes intact
        run: |
          set -euo pipefail
          if [ "${{ needs.check.outputs.custom_check }}" != "ok" ]; then
            echo "::error::自有改动指纹缺失，放弃推送"; exit 1
          fi
          echo "自有改动指纹完整"

      - name: Commit and push
        env:
          GH_TOKEN: ${{ github.token }}
          USING_PAT: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail
          git config user.name szwjp
          git config user.email szwjp@users.noreply.github.com

          # 只暂存本次真正会改的两处。不要 git add -A：checkout/merge 后工作区的
          # submodule 可能停在旧 SHA，git add -A 会把旧指针写回 index。
          git add dae-core.pin wing

          MSG="bump: 自动同步上游"
          if [ "${{ needs.check.outputs.need_dae }}" = true ]; then
            MSG="${MSG}"$'\n'"- dae-core -> ${{ needs.check.outputs.dae_new }}（落后 ${{ needs.check.outputs.dae_commits }} 个 commit）"
          fi
          if [ "${{ needs.check.outputs.need_wing }}" = true ]; then
            MSG="${MSG}"$'\n'"- dae-wing -> ${{ needs.check.outputs.wing_new }}（落后 ${{ needs.check.outputs.wing_commits }} 个 commit）"
          fi
          MSG="${MSG}"$'\n\n'"最终把关: build-custom.yml 的断言 + 编译（本次推送后触发）"

          git commit -q -m "$MSG"
          git push origin HEAD:main
          echo "已推送到 main"

          # GITHUB_TOKEN 的 push 不会触发下游 workflow，必须显式触发；
          # 用 PAT 推送时 push 事件自己会触发，避免重复构建。
          if [ "$USING_PAT" = "true" ]; then
            echo "::notice::使用 SYNC_TOKEN 推送，push 事件会自动触发 build-custom.yml"
          else
            gh workflow run build-custom.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "已显式触发 build-custom.yml"
          fi

  # daed 层（前端）单独一个 job：它要 merge 上游，有冲突可能，策略完全不同。
  # 本 fork 相对上游是 diverged，所以这里只做「干净才自动」——撞冲突就停下来，绝不猜着解决。
  # needs: bump 是为了串行化：两个 job 都会 push main，并发时后推者必然 non-fast-forward 失败。
  sync-daed:
    needs: [check, bump]
    if: always() && needs.check.outputs.need_daed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 这个 job 要 push：同样不能 persist-credentials: false（凭据在 checkout 结束前就被删）。
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      # git identity 必须先设好，否则 merge 会因 empty ident 直接失败
      - name: Configure git identity
        run: |
          git config user.name szwjp
          git config user.email szwjp@users.noreply.github.com
          git config --get user.email

      - name: Merge upstream daed
        run: |
          set -uo pipefail
          git remote add upstream https://github.com/daeuniverse/daed.git 2>/dev/null || true
          if ! git fetch -q upstream main; then
            echo "::error::fetch upstream/main 失败"
            exit 1
          fi

          git merge --no-edit upstream/main
          RC=$?

          if [ $RC -eq 0 ]; then
            echo "::notice::merge 干净，可自动推进"
            echo "MERGE_CLEAN=true" >> "$GITHUB_ENV"
            exit 0
          fi

          # 区分「真冲突」和「命令本身失败」——两者都要停下来，但提示不能一样
          CONFLICTS="$(git diff --name-only --diff-filter=U | tr '\n' ' ' | sed 's/ $//')"

          if [ -n "$CONFLICTS" ]; then
            echo "merge 冲突: $CONFLICTS"
            {
              echo "## ⛔ daed 上游有更新，但 merge 有冲突"
              echo ""
              echo "冲突文件: \`$CONFLICTS\`"
              echo ""
              echo "本 fork 相对上游是 **diverged**（既有自有改动，又落后上游提交），"
              echo "**已放弃自动合并**，仓库保持原状。"
              echo ""
              echo "需要人工处理，按 README §6「人工解 merge 冲突」的流程走。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=daed merge 冲突::需人工处理，见 README §6"
          else
            echo "::warning::merge 返回 $RC 但无冲突文件，说明是命令本身失败，不是内容冲突"
            git merge --abort 2>/dev/null || true
            {
              echo "## ⛔ daed merge 命令失败（非内容冲突）"
              echo ""
              echo "\`git merge\` 退出码 $RC，且冲突文件列表为空——这不是内容冲突。"
              echo "git identity 已在前面配好并回读校验过，常见原因是 unrelated histories、"
              echo "fetch 不完整或磁盘问题；本步骤日志里有 git 的原始报错。"
              echo ""
              echo "仓库保持原状。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=daed merge 命令失败::非内容冲突，见步骤日志"
          fi

          echo "MERGE_CLEAN=false" >> "$GITHUB_ENV"
          exit 1

      - name: Verify custom changes survived merge
        if: env.MERGE_CLEAN == 'true'
        run: |
          set -euo pipefail
          # 与 check job 的 custom_check 共用同一份脚本，避免两处清单漂移
          bash hack/check-fork-customizations.sh

      # P0-A：git merge 自己已经生成了 merge commit，这里绝不能再 commit 一次——
      # 之前的写法 `git commit ... || { exit 0; }` 会命中 "nothing to commit" 而
      # 静默跳过 push，merge 结果全留在 runner 上、run 还是绿的。
      - name: Push merged daed
        if: env.MERGE_CLEAN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          USING_PAT: ${{ secrets.SYNC_TOKEN != '' }}
        run: |
          set -euo pipefail
          # merge 后把 submodule 落到新记录的 SHA，避免工作区停留在旧指针
          git submodule update --init --recursive

          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "::notice::上游没有本 fork 缺的提交，无需推送"
            exit 0
          fi

          git push origin HEAD:main
          echo "已推送到 main"

          # 同 bump：GITHUB_TOKEN 推送不会触发下游 workflow，需显式触发
          if [ "$USING_PAT" = "true" ]; then
            echo "::notice::使用 SYNC_TOKEN 推送，push 事件会自动触发 build-custom.yml"
          else
            gh workflow run build-custom.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "已显式触发 build-custom.yml"
          fi

  # 失败可见性：上面三个 job 任意一个红，就确保有一个 open issue 记录这些失败。
  # 已有同标题的 open issue 时只追加评论，避免每天刷屏。
  notify:
    needs: [check, bump, sync-daed]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Report failure as an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="check-upstream 自动同步失败"
          BODY="$(printf '上游检查/同步失败，需要人工看一下。\n\n- run: %s/%s/actions/runs/%s\n- 提交: %s\n- 事件: %s\n\n排查：run 页面的 Summary 标签 → README §2 四道关口 → 需要手动时看 §5（bump）/ §6（解 merge 冲突）。\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_EVENT_NAME")"
          EXIST="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
                    --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" 2>/dev/null | head -1 || true)"
          if [ -n "$EXIST" ]; then
            gh issue comment "$EXIST" --repo "$GITHUB_REPOSITORY" --body "$BODY"
            echo "已在已有 issue #$EXIST 追加失败记录"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$BODY"
            echo "已创建失败 issue"
          fi
