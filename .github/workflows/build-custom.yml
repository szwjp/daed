name: Build daed bundle (linux/amd64)

# 用途：用官方 daed 源码 + bump 后的 wing 子模块，产出纯上游的 x86_64 daed 二进制。
# 官方 release-please.yml 已删除：fork 里的 Actions 无权创建 PR，该流程必然失败，
# 且本仓库的产物走 Actions artifact 而非 release，故不走它。
# 与官方构建相比的差异：
#   1) 显式安装 clang/llvm（官方 workflow 依赖 runner 预装，ebpf 那步容易挂）
#   2) 前端从源码构建（含自定义 UI：Header 显示内核版本），不再用官方 web.zip
#   3) dae-core pin 放在仓库根目录的普通文件 dae-core.pin（一行 40 位 sha），
#      不写在本文件里：GITHUB_TOKEN 没有 workflows 权限，自动 bump 一旦改动
#      .github/workflows/ 下的文件，push 就会被服务端拒绝。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOS: linux
      GOARCH: amd64
      GOAMD64: v1
      CGO_ENABLED: "0"
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pin dae-core to main (wing main requires Marshaller.Bytes, restored in #1117)
        id: pin
        run: |
          set -euo pipefail
          DAECORE="$(sed -nE 's/^([0-9a-f]{40})[[:space:]]*$/\1/p' dae-core.pin | head -1)"
          [ -n "$DAECORE" ] || { echo "::error::dae-core.pin 里没有合法的 40 位 sha"; exit 1; }
          echo "dae-core.pin: $DAECORE"
          git -C wing/dae-core fetch --depth 1 origin "$DAECORE"
          git -C wing/dae-core checkout -q "$DAECORE"
          git -C wing/dae-core submodule update --init --recursive
          [ "$(git -C wing/dae-core rev-parse HEAD)" = "$DAECORE" ] \
            || { echo "::error::dae-core 指针回读不一致"; exit 1; }
          echo "sha=$DAECORE" >> "$GITHUB_OUTPUT"

      # 断言：pin 的 dae-core 是否仍等于 dae main 的 tip。
      # 这道断言不校验编译产物，只校验「你构建的内核是不是上游最新」——
      # 上一版流程里 pin 落后时 CI 依然全绿，产物能跑、版本号照常，
      # 只有内核代码是旧的。这是唯一能在发布前发现 pin 腐烂的地方。
      - name: Assert dae-core pin matches dae main
        run: |
          PINNED="${{ steps.pin.outputs.sha }}"
          cd wing/dae-core

          # 取 main 的 tip。浅克隆下用 FETCH_HEAD，避免 --depth 1 时
          # main tip 与 pin 不在同一历史导致 fetch 失败。
          git fetch --depth 1 origin main
          UPSTREAM="$(git rev-parse FETCH_HEAD)"

          echo "pinned    : $PINNED"
          echo "dae main  : $UPSTREAM"

          if [ "$PINNED" = "$UPSTREAM" ]; then
            echo "::notice title=dae-core pin::in sync with dae main"
            exit 0
          fi

          # 落后多少：需要完整历史才能算，超出浅克隆深度就退化为 "unknown"。
          git fetch --unshallow origin 2>/dev/null || git fetch --depth 200 origin main
          if git merge-base --is-ancestor "$PINNED" "$UPSTREAM" 2>/dev/null; then
            BEHIND="$(git rev-list --count "$PINNED".."$UPSTREAM")"
            SUBJECT="$(git log -1 --format=%s "$UPSTREAM")"
            {
              echo "## dae-core pin 已落后 dae main" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "- pinned: \`$PINNED\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- main  : \`$UPSTREAM\`" >> "$GITHUB_STEP_SUMMARY"
              echo "- 落后  : **$BEHIND** 个 commit" >> "$GITHUB_STEP_SUMMARY"
              echo "- main  : $SUBJECT" >> "$GITHUB_STEP_SUMMARY"
              echo "" >> "$GITHUB_STEP_SUMMARY"
              echo "更新 pin：改仓库根目录的 dae-core.pin（一行 40 位 sha），" >> "$GITHUB_STEP_SUMMARY"
              echo "确认 wing main 需要的 \`Marshaller.Bytes\` 仍在后重新构建。" >> "$GITHUB_STEP_SUMMARY"
            } || true
            echo "::warning title=dae-core pin stale::落后 $BEHIND 个 commit，产物仍可构建但内核不是 dae 最新"
            exit 1
          fi

          # pin 不在上游 main 的祖先链上：可能被 revert、force-push 或写错。
          {
            echo "## dae-core pin 与 dae main 无祖先关系" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$PINNED\` 不是 \`$UPSTREAM\` 的祖先。pin 可能已被 revert 或 force-push 掉，" >> "$GITHUB_STEP_SUMMARY"
            echo "必须人工确认后再使用这个产物。" >> "$GITHUB_STEP_SUMMARY"
          } || true
          echo "::error title=dae-core pin diverged::pin 不是 dae main 的祖先，需人工确认"
          exit 1

      - name: Show pinned revisions
        run: |
          echo "daed     : $(git rev-parse HEAD)"
          echo "wing     : $(git -C wing rev-parse HEAD)"
          echo "dae-core : $(git -C wing/dae-core rev-parse HEAD)"
          echo "outbound : $(grep -E 'olicesx/outbound' wing/go.mod | head -1)"

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
          cache: false

      - name: Install clang / llvm-strip
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm
          if ! command -v llvm-strip >/dev/null 2>&1; then
            sudo ln -sf "$(ls /usr/bin/llvm-strip* | head -1)" /usr/local/bin/llvm-strip
          fi
          clang --version | head -2
          llvm-strip --version | head -1

      - uses: pnpm/action-setup@v6.0.9

      - uses: actions/setup-node@v6
        with:
          node-version: latest
          cache: pnpm

      - name: Build web assets from source (includes the daemon-version chip)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          pnpm install
          pnpm build --filter daed
          test -f apps/web/dist/index.html
          du -sh apps/web/dist
          grep -rlo "coreVersion" apps/web/dist/assets | head -3

      - name: make deps (graphql resolver + eBPF object)
        working-directory: wing
        run: make deps

      - name: Bundle
        working-directory: wing
        run: |
          mkdir -p ../bundled
          make OUTPUT=../bundled/daed-linux-x86_64 APPNAME=daed \
               WEB_DIST=../apps/web/dist VERSION="v2.1.1-wingmain-$(date -u +%Y%m%d)" bundle

      - name: Collect bundle
        run: |
          cd bundled
          cp ../install/daed.service ../install/daed.desktop .
          cp -r ../install/icons .
          curl -sSL -o geoip.dat  https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geoip.dat
          curl -sSL -o geosite.dat https://github.com/v2rayA/dist-v2ray-rules-dat/raw/master/geosite.dat
          file daed-linux-x86_64
          ./daed-linux-x86_64 --version || true
          strings daed-linux-x86_64 | grep -cE "disable_thp|auto_sniff_punt|bpf_conn_state_map_size" || true

      - uses: actions/upload-artifact@v7
        with:
          name: daed-linux-x86_64-bundle
          path: bundled/*

  # 产物分发：把 bundle 打成 tar.gz 上传 GitHub Release，OpenWrt 包从 release 拉。
  # 触发：push 触发且 build 跑通；commit message 含 [skip release] 时跳过。
  # 重复发布同一日 release 时先删旧的；tag 形如 v2.1.1-nightly-20261016。
  #
  # 防御性 if：push 的 before/after 字段在 re-run 场景可能为 null，
  # 这里只依赖 event_name + commit message（注意 GH 表达式没有 toLower，skip token 写全小写）。
  release:
    needs: build
    if: >-
      success() &&
      github.event_name == 'push' &&
      (github.event.head_commit.message == null ||
       !contains(github.event.head_commit.message, '[skip release]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: daed-linux-x86_64-bundle
          path: bundled

      - name: Inspect bundle
        run: |
          ls -la bundled/
          file bundled/daed-linux-x86_64

      - name: Pin dae-core in release notes
        run: |
          PIN="$(cat dae-core.pin)"
          echo "DAECORE_PIN=$PIN" >> "$GITHUB_ENV"

      - name: Pack tarball
        run: |
          tar -czf daed-linux-x86_64.tar.gz \
            -C bundled daed-linux-x86_64 daed.service daed.desktop icons \
            geoip.dat geosite.dat
          ls -la daed-linux-x86_64.tar.gz
          # 上传到 runner 的固定路径，方便 create release 时 attach
          echo "ASSET_PATH=$(pwd -W 2>/dev/null || pwd)/daed-linux-x86_64.tar.gz" >> "$GITHUB_ENV"

      - name: Compute tag and notes
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="$(date -u +%Y%m%d)"
          TAG="v2.1.1-nightly-${DATE}"
          VERSION_DATE="$(date -u +%Y.%m.%d)"
          COMPARED="$(gh api repos/szwjp/daed/compare/${{ github.event.before }}...${{ github.sha }} --jq '.commits | length' 2>/dev/null || echo 0)"
          NOTES="$(cat <<EOF
          # szwjp/daed nightly ${VERSION_DATE}

          - commit: \`${{ github.sha }}\`
          - dae-core pin: \`${DAECORE_PIN}\`
          - wing: pinned in submodule
          - this run: ${COMPARED} commit(s) since previous build

          ## What this is
          daed (web UI) bundled with dae + dae-wing, built from szwjp/daed@main.
          See https://github.com/szwjp/daed for fork details and upstream sync policy.

          ## Install on OpenWrt
          See https://github.com/szwjp/luci-app-daed for the matching LuCI package.

          Built by the \`build-custom\` workflow.
          EOF
          )"
          # 同一日重发：先删旧 tag
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::release $TAG 已存在，先删除再重发"
            gh release delete "$TAG" --yes
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          {
            echo "NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "szwjp/daed nightly $(date -u +%Y.%m.%d)" \
            --notes "${{ steps.meta.outputs.NOTES }}" \
            --target "${{ github.sha }}" \
            "$ASSET_PATH#daed-linux-x86_64.tar.gz"
